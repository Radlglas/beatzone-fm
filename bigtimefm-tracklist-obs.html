<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BigTimeFM – Tracklist OBS</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow+Condensed:wght@400;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --accent:   #FF2D55;
      --accent2:  #FF6B00;
      --bg:       rgba(7, 7, 10, 0.96);
      --surface:  rgba(255,255,255,0.04);
      --surface2: rgba(255,255,255,0.08);
      --line:     rgba(255,255,255,0.06);
      --text1:    #FFFFFF;
      --text2:    rgba(255,255,255,0.5);
      --text3:    rgba(255,255,255,0.25);
      --w: 420px;
    }

    html, body {
      width: var(--w);
      height: auto;
      background: transparent;
      overflow: hidden;
    }

    .widget {
      width: var(--w);
      background: var(--bg);
      border: 1px solid var(--line);
      border-radius: 14px;
      overflow: hidden;
      font-family: 'Barlow Condensed', sans-serif;
      position: relative;
      box-shadow:
        0 0 0 1px rgba(255,45,85,0.08),
        0 24px 64px rgba(0,0,0,0.8),
        inset 0 1px 0 rgba(255,255,255,0.06);
    }

    /* noise texture overlay */
    .widget::before {
      content: '';
      position: absolute;
      inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='1'/%3E%3C/svg%3E");
      opacity: 0.03;
      pointer-events: none;
      z-index: 10;
      border-radius: 14px;
    }

    /* ── HEADER ── */
    .header {
      padding: 18px 20px 14px;
      border-bottom: 1px solid var(--line);
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: relative;
      background: linear-gradient(180deg, rgba(255,45,85,0.07) 0%, transparent 100%);
    }

    .header-left {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .brand {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 28px;
      letter-spacing: 0.04em;
      color: var(--text1);
      line-height: 1;
      background: linear-gradient(135deg, #fff 0%, rgba(255,255,255,0.7) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .brand span {
      background: linear-gradient(135deg, var(--accent) 0%, var(--accent2) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .subtitle {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 9px;
      letter-spacing: 0.2em;
      color: var(--text3);
      text-transform: uppercase;
    }

    .live-badge {
      display: flex;
      align-items: center;
      gap: 6px;
      background: rgba(255,45,85,0.1);
      border: 1px solid rgba(255,45,85,0.25);
      border-radius: 20px;
      padding: 4px 10px 4px 8px;
    }

    .live-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 8px var(--accent);
      animation: pulse 2s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; box-shadow: 0 0 8px var(--accent); }
      50%       { opacity: 0.4; box-shadow: 0 0 3px var(--accent); }
    }

    .live-text {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 9px;
      letter-spacing: 0.15em;
      color: var(--accent);
      font-weight: 500;
    }

    /* accent line below header */
    .accent-bar {
      height: 2px;
      background: linear-gradient(90deg, var(--accent) 0%, var(--accent2) 40%, transparent 100%);
      opacity: 0.6;
    }

    /* ── SECTION LABEL ── */
    .section-label {
      padding: 12px 20px 10px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .section-label-text {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 9px;
      letter-spacing: 0.25em;
      color: var(--text3);
      text-transform: uppercase;
    }

    .section-line {
      flex: 1;
      height: 1px;
      background: var(--line);
    }

    /* ── TRACK LIST ── */
    .tracklist {
      padding: 0 0 8px;
    }

    .track {
      display: grid;
      grid-template-columns: 28px 1fr auto;
      align-items: center;
      gap: 0 12px;
      padding: 10px 20px;
      border-bottom: 1px solid var(--line);
      transition: background 0.3s ease;
      position: relative;
      animation: slideIn 0.4s cubic-bezier(0.22, 1, 0.36, 1) both;
    }

    @keyframes slideIn {
      from {
        opacity: 0;
        transform: translateY(-8px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .track:last-child {
      border-bottom: none;
    }

    .track:hover {
      background: var(--surface);
    }

    /* current track highlight */
    .track.current {
      background: linear-gradient(90deg, rgba(255,45,85,0.08) 0%, transparent 100%);
    }

    .track.current::before {
      content: '';
      position: absolute;
      left: 0;
      top: 0;
      bottom: 0;
      width: 2px;
      background: linear-gradient(180deg, var(--accent) 0%, var(--accent2) 100%);
      border-radius: 0 2px 2px 0;
    }

    /* track number */
    .track-num {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 11px;
      color: var(--text3);
      text-align: center;
      line-height: 1;
    }

    .track.current .track-num {
      color: var(--accent);
    }

    /* track info */
    .track-info {
      min-width: 0;
    }

    .track-artist {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 15px;
      font-weight: 700;
      letter-spacing: 0.03em;
      color: var(--text1);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      line-height: 1.2;
      text-transform: uppercase;
    }

    .track.current .track-artist {
      background: linear-gradient(90deg, #fff 0%, rgba(255,255,255,0.85) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .track-title {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 13px;
      font-weight: 400;
      color: var(--text2);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      line-height: 1.3;
      margin-top: 1px;
    }

    /* time */
    .track-time {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 11px;
      font-weight: 400;
      color: var(--text3);
      white-space: nowrap;
      letter-spacing: 0.05em;
      align-self: center;
    }

    .track.current .track-time {
      color: rgba(255,45,85,0.6);
    }

    /* ── FOOTER ── */
    .footer {
      padding: 10px 20px;
      border-top: 1px solid var(--line);
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(0,0,0,0.2);
    }

    .footer-label {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 9px;
      color: var(--text3);
      letter-spacing: 0.15em;
      text-transform: uppercase;
    }

    .footer-time {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 9px;
      color: var(--text3);
      letter-spacing: 0.1em;
    }

    /* ── LOADING / ERROR STATE ── */
    .state-msg {
      padding: 32px 20px;
      text-align: center;
      font-family: 'IBM Plex Mono', monospace;
      font-size: 11px;
      color: var(--text3);
      letter-spacing: 0.1em;
    }

    /* ── SHIMMER SKELETON ── */
    .skeleton {
      padding: 10px 20px;
      display: grid;
      grid-template-columns: 28px 1fr auto;
      align-items: center;
      gap: 0 12px;
      border-bottom: 1px solid var(--line);
    }

    .skeleton-box {
      background: var(--surface2);
      border-radius: 4px;
      animation: shimmer 1.5s ease-in-out infinite;
    }

    @keyframes shimmer {
      0%   { opacity: 0.4; }
      50%  { opacity: 0.8; }
      100% { opacity: 0.4; }
    }
  </style>
</head>
<body>
  <div class="widget">
    <div class="header">
      <div class="header-left">
        <div class="brand">Big<span>Time</span>FM</div>
        <div class="subtitle">Die biggesten Beats im Netz</div>
      </div>
      <div class="live-badge">
        <div class="live-dot"></div>
        <div class="live-text">LIVE</div>
      </div>
    </div>
    <div class="accent-bar"></div>

    <div class="section-label">
      <div class="section-label-text">Zuletzt gespielt</div>
      <div class="section-line"></div>
    </div>

    <div class="tracklist" id="tracklist">
      <!-- skeleton while loading -->
      ${[1,2,3,4,5,6].map(() => `
        <div class="skeleton">
          <div class="skeleton-box" style="width:18px;height:12px;margin:auto;"></div>
          <div>
            <div class="skeleton-box" style="height:13px;width:70%;margin-bottom:5px;"></div>
            <div class="skeleton-box" style="height:11px;width:50%;"></div>
          </div>
          <div class="skeleton-box" style="width:40px;height:11px;"></div>
        </div>
      `).join('')}
    </div>

    <div class="footer">
      <div class="footer-label">Auto-Update alle 30s</div>
      <div class="footer-time" id="last-update">–</div>
    </div>
  </div>

  <script>
    const API = 'https://backend.bigtimefm.de/api/?output=tracklist';
    let prevTopTitle = null;

    function formatTime(timeStr) {
      // timeStr is "HH:MM:SS" — display as "HH:MM"
      if (!timeStr) return '';
      return timeStr.substring(0, 5);
    }

    function now() {
      return new Date().toLocaleTimeString('de-DE', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
    }

    async function load() {
      try {
        const res = await fetch(API, { cache: 'no-store' });
        if (!res.ok) throw new Error(res.status);
        const tracks = await res.json();

        const list = document.getElementById('tracklist');

        // detect new track (top changed)
        const topTitle = tracks[0]?.title;
        const isNew = prevTopTitle !== null && topTitle !== prevTopTitle;
        prevTopTitle = topTitle;

        // limit to 8 tracks
        const shown = tracks.slice(0, 8);

        list.innerHTML = shown.map((t, i) => {
          const isCurrent = i === 0;
          const delay = isNew ? i * 50 : 0;
          return `
            <div class="track${isCurrent ? ' current' : ''}" style="animation-delay:${delay}ms">
              <div class="track-num">${isCurrent ? '▶' : String(i + 1).padStart(2, '0')}</div>
              <div class="track-info">
                <div class="track-artist">${escHtml(t.artist)}</div>
                <div class="track-title">${escHtml(t.title)}</div>
              </div>
              <div class="track-time">${formatTime(t.time)}</div>
            </div>
          `;
        }).join('');

        document.getElementById('last-update').textContent = now();

      } catch (e) {
        document.getElementById('tracklist').innerHTML =
          `<div class="state-msg">FEHLER BEIM LADEN<br>${e.message}</div>`;
      }
    }

    function escHtml(s) {
      return String(s)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    load();
    setInterval(load, 30000);
  </script>
</body>
</html>
