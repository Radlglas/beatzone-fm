<svg viewBox="0 0 1480 420" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Joystream FM">
  <defs>
    <style>@import url('https://fonts.googleapis.com/css2?family=Anton&amp;family=Barlow+Condensed:wght@600&amp;display=swap');</style>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff4438"/>
      <stop offset=".55" stop-color="#e11d48"/>
      <stop offset="1" stop-color="#9f1239"/>
    </linearGradient>
    <radialGradient id="glow" cx=".3" cy=".2" r=".95">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".38"/>
      <stop offset=".45" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="9" stdDeviation="11" flood-color="#4c0519" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Mark: Kopfhörer -->
  <g transform="translate(36,24) scale(0.72)">
    <rect x="16" y="16" width="480" height="480" rx="116" fill="url(#tile)"/>
    <rect x="16" y="16" width="480" height="480" rx="116" fill="url(#glow)"/>
    <g filter="url(#soft)">
      <path d="M148 288 A108 108 0 0 1 364 288" fill="none" stroke="#fff5f5" stroke-width="34" stroke-linecap="round"/>
      <rect x="120" y="278" width="56" height="120" rx="28" fill="#fff5f5"/>
      <rect x="336" y="278" width="56" height="120" rx="28" fill="#fff5f5"/>
    </g>
  </g>

  <!-- Wortmarke -->
  <text x="470" y="248" font-family="Anton, sans-serif" font-size="150" letter-spacing="3" fill="#fff5f5">JOYSTREAM<tspan fill="#f6b83a"> FM</tspan></text>
  <text x="474" y="318" font-family="'Barlow Condensed', sans-serif" font-weight="600" font-size="40" letter-spacing="14" fill="#e8c877">DEIN SOUND · DEIN STREAM</text>
</svg>
